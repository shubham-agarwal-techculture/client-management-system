[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "client-management-system"
version = "0.1.0"
description = "A domain-agnostic, extensible client management system."
requires-python = ">=3.11"
authors = [{ name = "Cline" }]
license = "MIT"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "jinja2>=3.1.0",
    "aiosqlite"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "sqlalchemy-utils>=0.41.0",
]
# Optional production database drivers (install the one you use):
#   pip install psycopg2-binary   # PostgreSQL
#   pip install asyncpg           # PostgreSQL (async)
#   pip install pymysql           # MySQL

[tool.setuptools]
packages = ["app", "app.models", "app.schemas", "app.api", "app.api.v1",
            "app.services", "app.core", "app.ui"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]