[alembic]
# path to migration scripts
script_location = alembic

# database to connect to
# DATABASE_URL is injected from .env at runtime via env.py
sqlalchemy.url =

# version location
version_locations = %(here)s/alembic/versions

# timezone to use when running the console
timezone = utc

# max length of characters to apply to the version code
# (see https://alembic.sqlalchemy.org/en/latest/tutorial.html#create-a-migration-script)
# version_code_max_length = 64

# The set of tables/views/indexes to include when autogenerating
# migrations. See the documentation for details.
# include_object =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts. See the documentation for further
# detail and examples
# post_write_hooks = script

# revision file naming format
# revision_file_naming = %%(rev)s_%%(slug)s
# revision_file_naming = script.py.alembic.bak

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S